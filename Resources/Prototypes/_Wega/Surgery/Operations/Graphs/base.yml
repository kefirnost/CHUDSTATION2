- type: surgeryGraph
  id: BaseSurgery
  nodes:
  - id: Default
    transitions:
    - id: MakeIncision
      target: Incised
      label: surgery-transition-incision
      steps:
      - action: Cut
        tags:
        - SurgeryTool
        duration: 3
        successChance: 0.95
  - id: Incised
    transitions:
    - id: RemoveHeart
      target: HeartRemoved
      label: surgery-transition-remove-heart
      steps:
      - action: RemoveOrgan
        requiredOrgan: Heart
        tags:
        - SurgeryTool
        duration: 4
        successChance: 0.9
    - id: CloseIncision
      target: Default
      label: surgery-transition-close
      steps:
      - action: ClampBleeding
        tags:
        - SurgeryTool
        duration: 2
        successChance: 0.95
  - id: HeartRemoved
    transitions:
    - id: InsertHeart
      target: Default
      label: surgery-transition-insert-heart
      steps:
      - action: InsertOrgan
        requiredOrgan: Heart
        duration: 4
        successChance: 0.9

- type: entity
  id: BaseVehicleStrap
  abstract: true
  components:
  - type: Sprite
    noRot: true
  - type: InputMover
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Physics
    bodyType: KinematicController
  - type: Vehicle
    canAttack: true
  - type: StrapVehicle
  - type: Strap
  - type: MovementSpeedModifier
    weightlessModifier: 0
    acceleration: 2
    friction: 2
    frictionNoInput: 6
    baseWalkSpeed: 4.5
    baseSprintSpeed: 6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 360
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound

- type: entity
  id: VehicleWheelchair
  parent: [BaseVehicleStrap, BaseFoldable, BaseItem]
  name: wheelchair
  description: A chair with big wheels. It looks like you can move in these on your own.
  components:
  - type: Sprite
    sprite: Objects/Vehicles/wheelchair.rsi
    layers:
    - state: wheelchair
      map: ["unfoldedLayer"]
    - state: wheelchair_folded
      map: ["foldedLayer"]
      visible: false
  - type: Item
    size: Ginormous
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: GravityAffected
  - type: Strap
    buckleOffset: "0,-0.05"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 360
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer
  - type: StaticPrice
    price: 70

- type: entity
  parent: VehicleWheelchair
  id: VehicleWheelchairFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: False

- type: entity
  id: VehicleJanicart
  parent: BaseVehicleStrap
  name: janicart
  description: The janitor's trusty steed.
  components:
  - type: Sprite
    sprite: Objects/Vehicles/janicart.rsi
    drawdepth: Mobs # fixes layering like magic.
    layers:
    - state: vehicle
      map: ["movement"]
  - type: SpriteMovement
    movementLayers:
      movement:
        state: vehicle-moving
    noMovementLayers:
      movement:
        state: vehicle
  - type: Vehicle
  - type: VehicleHandBlocker
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - JanicartKeys
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 3.5
    softness: 2
    lightMask: ConeSingle
    autoRot: true
  - type: GravityAffected
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      #- !type:SpawnEntitiesBehavior # in future should also emit a cloud of hot gas
      #  spawn:
      #    VehicleJanicartDestroyed:
      #      min: 1
      #      max: 1
  - type: Strap
    buckleOffset: "0.01,0.15"
    modifyBuckleDrawDepth: false
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          tags:
          - JanicartKeys
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
      trashbag_slot:
        name: janitorial-trolley-slot-component-slot-name-trashbag
        whitelist:
          tags:
          - TrashBag
  - type: ContainerContainer
    containers:
      key_slot: !type:ContainerSlot
      trashbag_slot: !type:ContainerSlot
  - type: ItemMapper
    mapLayers:
      storage:
        whitelist:
          tags:
          - TrashBag
    sprite: Objects/Vehicles/janicart.rsi


# Skateboard
- type: entity
  id: VehicleSkateboard
  parent: BaseVehicleStrap
  name: skateboard
  description: A sturdy four-wheeled board. Stand on it and roll around the station.
  components:
  - type: Sprite
    sprite: Objects/Vehicles/skateboard.rsi
    drawdepth: Mobs
    layers:
    - state: skateboard
  - type: Strap
    buckleOffset: "0,0.10"
    modifyBuckleDrawDepth: false
  - type: MovementSpeedModifier
    acceleration: 5
    friction: 0.75
    frictionNoInput: 0.35
    baseWalkSpeed: 5.25
    baseSprintSpeed: 7
  - type: Skateboard
    trickStaminaCost: 15
  - type: ActionGrant
    actions:
    - ActionSkateboardTrick
  - type: Appearance

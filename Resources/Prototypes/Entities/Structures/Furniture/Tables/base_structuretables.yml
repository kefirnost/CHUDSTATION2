- type: entity
  abstract: true
  parent: BaseStructure
  id: TableBase
  name: table
  description: A square piece of metal standing on four metal legs.
  components:
  - type: Animateable
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
  - type: SpriteFade
  - type: Sprite
  - type: Icon
    state: full
  - type: IconSmooth
    key: table
    states:
    - !type:CornerSpriteSmoothing
      mask: [ table ]
      base: state_
  - type: Climbable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4
  # KS14 start: shoving someone into a table puts them on it
  - type: KsShoveObstacle
    placeOnto: true
    priority: 10
    sound: /Audio/_KS14/Effects/Shove/tableslam.ogg
    popups:
      user: ks-shove-onto-user
      target: ks-shove-onto-target
      others: ks-shove-onto-others
  # KS14 end
  - type: Clickable
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHull
  - type: Tag
    tags:
    - ForceFixRotations

- type: entity
  abstract: true
  parent: TableBase
  id: CounterBase
  name: counter
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
        - LowImpassable
  - type: IconSmooth
    key: counter
    states:
    - !type:CornerSpriteSmoothing
      mask: [ counter ]
      base: state_

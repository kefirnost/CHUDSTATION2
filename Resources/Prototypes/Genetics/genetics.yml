- type: entity
  id: GeneTekConsole
  parent: MedicalScanner
  name: GeneTek genetics console
  description: A medical scanner fitted with a gene sequencing and mutation research terminal.
  components:
  - type: GeneticsConsole
  - type: Machine
    board: GeneTekMachineCircuitboard
  - type: AccessReader
    access: [[Research]]
  - type: ActivatableUIRequiresAccess
  - type: ActivatableUIRequiresPower
  - type: ActivatableUI
    singleUser: true
    key: enum.GeneticsConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GeneticsConsoleUiKey.Key:
        type: GeneticsConsoleBoundUserInterface

- type: entity
  id: GeneTekMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: GeneTek machine board
  description: A machine printed circuit board for a GeneTek genetics console.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: GeneTekConsole
    stackRequirements:
      Manipulator: 4
      Cable: 5
      Glass: 3

- type: entity
  id: GeneTekDnaActivator
  parent: BaseItem
  name: DNA activator
  description: A single-use cartridge that activates a subject's potential mutation.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/implanter.rsi
    state: implanter0
  - type: Item
    sprite: Objects/Specific/Medical/implanter.rsi
    heldPrefix: implanter
    size: Small
  - type: GeneticsGeneTool
    kind: Activator

- type: entity
  id: GeneTekDnaInjector
  parent: BaseItem
  name: DNA injector
  description: A single-use cartridge that introduces a researched mutation into a subject.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/implanter.rsi
    state: implanter1
  - type: Item
    sprite: Objects/Specific/Medical/implanter.rsi
    heldPrefix: implanter
    size: Small
  - type: GeneticsGeneTool
    kind: Injector

- type: entity
  id: GeneticsStableFootingEffect
  parent: MobStatusEffectBase
  name: stable footing
  components:
  - type: FrictionStatusEffect
    frictionModifier: 1.15
    accelerationModifier: 1.15

- type: entity
  parent: StatusEffectSpeed
  id: GeneticsQuickStepEffect
  name: quick step
  components:
  - type: MovementModStatusEffect
    walkSpeedModifier: 1.1
    sprintSpeedModifier: 1.1

- type: geneticsGene
  id: GenePressureAdaptation
  name: gene-pressure-adaptation-name
  description: gene-pressure-adaptation-desc
  effect: StatusEffectPressureImmunity
  sequence: ATCGGCTA
  exclusiveGroup: environment
  researchCost: 20
  stabilityCost: 15
  reclaimReward: 15

- type: geneticsGene
  id: GeneStableFooting
  name: gene-stable-footing-name
  description: gene-stable-footing-desc
  effect: GeneticsStableFootingEffect
  sequence: CGATATGC
  exclusiveGroup: mobility
  researchCost: 20
  stabilityCost: 10
  reclaimReward: 10

- type: geneticsGene
  id: GeneQuickStep
  name: gene-quick-step-name
  description: gene-quick-step-desc
  effect: GeneticsQuickStepEffect
  sequence: GCTATACG
  exclusiveGroup: mobility
  researchCost: 25
  stabilityCost: 15
  reclaimReward: 15

- type: geneticsUpgrade
  id: GeneTekMutationStorage
  name: genetics-upgrade-mutation-storage-name
  description: genetics-upgrade-mutation-storage-desc
  researchCost: 100
  requiredGenesResearched: 1

- type: geneticsUpgrade
  id: GeneTekDnaInjectors
  name: genetics-upgrade-dna-injectors-name
  description: genetics-upgrade-dna-injectors-desc
  researchCost: 120
  requiredGenesResearched: 2

- type: geneticsUpgrade
  id: GeneTekDnaReclaimer
  name: genetics-upgrade-dna-reclaimer-name
  description: genetics-upgrade-dna-reclaimer-desc
  researchCost: 100
  requiredGenesResearched: 1

- type: geneticsUpgrade
  id: GeneTekExpandedMutationStorage
  name: genetics-upgrade-expanded-storage-name
  description: genetics-upgrade-expanded-storage-desc
  researchCost: 120
  prerequisites:
  - GeneTekMutationStorage
